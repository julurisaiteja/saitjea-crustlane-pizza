name: assemble-package-lock
on:
  push:
    paths:
      - "lock-parts/**"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble package-lock.json
        run: |
          set -euo pipefail
          if [ ! -d lock-parts ]; then exit 0; fi
          cat lock-parts/part-*.b64 | base64 -d > package-lock.json
          rm -rf lock-parts
          rm -f .github/workflows/assemble-package-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git add -u lock-parts .github/workflows/assemble-package-lock.yml || true
          git commit -m "Assemble package-lock.json from parts" || exit 0
          git push
